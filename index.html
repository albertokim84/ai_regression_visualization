<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>스텝바이스텝 회귀 학습 시뮬레이터</title>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --gray: #64748b;
            --bg: #f8fafc;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Pretendard', -apple-system, sans-serif;
            margin: 0; padding: 15px;
            background-color: var(--bg);
            color: #0f172a;
            display: flex; flex-direction: column; align-items: center;
        }
        .container {
            width: 100%; max-width: 600px;
            background: white; padding: 15px;
            border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        h1 { font-size: 1.3rem; text-align: center; margin: 5px 0 15px 0; }
        .tips {
            background-color: #eff6ff; padding: 12px;
            border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px;
            line-height: 1.5; color: #1e3a8a;
        }
        .tips ul { margin: 8px 0 0 0; padding-left: 20px; }
        
        .status-board {
            display: flex; flex-direction: column; gap: 8px;
            background: #f1f5f9; padding: 12px; border-radius: 8px;
            margin-bottom: 15px; font-weight: bold; font-size: 0.95rem;
        }
        .status-row { display: flex; justify-content: space-between; align-items: center; }
        .equation { color: var(--success); font-family: monospace; font-size: 1.05rem; background: #e2e8f0; padding: 4px 8px; border-radius: 4px;}
        .error-container { text-align: right; }
        .error-rate { color: var(--danger); font-size: 1.05rem; }
        .error-desc { font-size: 0.75rem; color: var(--gray); font-weight: normal; margin-top: 2px; }
        
        .canvas-container {
            position: relative; width: 100%; aspect-ratio: 3 / 2;
            background-color: #ffffff; border: 2px solid #e2e8f0;
            border-radius: 8px; overflow: hidden;
        }
        
        /* 터치 시 스크롤 방지 및 이벤트 충돌 해결을 위한 CSS 추가 */
        canvas { 
            width: 100%; height: 100%; 
            cursor: crosshair; 
            touch-action: none; 
            pointer-events: auto;
        }
        
        .controls {
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px;
        }
        .controls-full {
            grid-column: span 2; display: flex; gap: 8px;
        }
        button {
            padding: 10px 8px; font-size: 0.9rem; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer;
            transition: opacity 0.2s; color: white; text-align: center;
        }
        button:active { opacity: 0.8; transform: scale(0.98); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .btn-init { background-color: var(--warning); }
        .btn-step { background-color: var(--primary); }
        .btn-auto { background-color: var(--success); }
        .btn-prev { background-color: var(--gray); flex: 1; }
        .btn-reset { background-color: #94a3b8; flex: 1; }

        .toast {
            position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 8px 16px;
            border-radius: 20px; font-size: 0.85rem; pointer-events: none;
            opacity: 0; transition: opacity 0.3s; white-space: nowrap; font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>회귀(Regression) 시뮬레이터</h1>
    
    <div class="tips">
        <strong>💡 실습 가이드</strong>
        <ul>
            <li><strong>데이터 입력:</strong> 빈 공간을 터치해 점을 5~10개 찍어보세요.</li>
            <li><strong>초기화:</strong> [초기 선 긋기]를 누르면 컴퓨터가 <strong style="color: var(--danger); font-size: 1.05rem;">무작위</strong>로 선을 긋습니다.</li>
            <li><strong>학습하기:</strong> [1단계 학습]을 누를 때마다 <b>빨간 점선(오차)</b>이 줄어드는 방향으로 선이 스스로 이동합니다.</li>
        </ul>
    </div>

    <div class="status-board">
        <div class="status-row">
            <div>회귀 방정식 (모델)</div>
            <div class="equation" id="eq-display">선이 없습니다</div>
        </div>
        <div class="status-row">
            <div>예측 정확도 지표</div>
            <div class="error-container">
                <div class="error-rate">평균제곱오차(MSE): <span id="error-display">0.0000</span></div>
                <div class="error-desc">(오차 제곱의 평균)</div>
            </div>
        </div>
    </div>

    <div class="canvas-container" id="canvas-wrapper">
        <canvas id="simCanvas"></canvas>
        <div id="toast" class="toast">데이터가 추가되었습니다.</div>
    </div>

    <div class="controls">
        <button id="btn-init" class="btn-init">초기 선 긋기</button>
        <button id="btn-step" class="btn-step" disabled>+1단계 학습 (Step)</button>
        <div class="controls-full">
            <button id="btn-prev" class="btn-prev" disabled>이전 단계 ↩</button>
            <button id="btn-auto" class="btn-auto" disabled>연속 학습 ▶</button>
            <button id="btn-reset" class="btn-reset">모두 지우기</button>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    let cWidth = 600;
    let cHeight = 400;
    canvas.width = cWidth;
    canvas.height = cHeight;

    // 다시 빈 화면(데이터 없음)으로 초기화
    let points = []; 
    
    let w = null; 
    let b = null; 
    let history = []; 
    let isAutoRunning = false;
    let autoInterval;
    const learningRate = 0.05; 

    const eqDisplay = document.getElementById('eq-display');
    const errorDisplay = document.getElementById('error-display');
    const btnInit = document.getElementById('btn-init');
    const btnStep = document.getElementById('btn-step');
    const btnPrev = document.getElementById('btn-prev');
    const btnAuto = document.getElementById('btn-auto');
    const btnReset = document.getElementById('btn-reset');
    const toast = document.getElementById('toast');

    // === 🛠 오류 해결: 마우스 클릭 이벤트 완벽 분리 ===
    canvas.addEventListener('click', function(e) {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = 1.0 - ((e.clientY - rect.top) / rect.height);
        addPoint(x, y);
    });

    // === 🛠 오류 해결: 모바일 터치 이벤트 완벽 분리 ===
    canvas.addEventListener('touchstart', function(e) {
        // e.preventDefault()로 터치 시 화면이 스크롤되거나 클릭 이벤트가 이중으로 발생하는 것을 막습니다.
        e.preventDefault(); 
        const rect = canvas.getBoundingClientRect();
        const x = (e.touches[0].clientX - rect.left) / rect.width;
        const y = 1.0 - ((e.touches[0].clientY - rect.top) / rect.height);
        addPoint(x, y);
    }, {passive: false});

    // 점 추가 공통 함수
    function addPoint(x, y) {
        if (w !== null) saveState();
        points.push({x: x, y: y});
        showToast("데이터 추가됨");
        draw();
    }

    function draw() {
        ctx.clearRect(0, 0, cWidth, cHeight);

        ctx.strokeStyle = '#f1f5f9';
        ctx.lineWidth = 1;
        for(let i = 1; i < 10; i++) {
            ctx.beginPath(); ctx.moveTo(i*cWidth/10, 0); ctx.lineTo(i*cWidth/10, cHeight); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, i*cHeight/10); ctx.lineTo(cWidth, i*cHeight/10); ctx.stroke();
        }

        let totalError = 0;

        if (w !== null && b !== null) {
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            points.forEach(p => {
                const predY = w * p.x + b;
                const error = p.y - predY;
                totalError += error * error; 

                const canvasX = p.x * cWidth;
                const canvasY = (1 - p.y) * cHeight;
                const canvasPredY = (1 - predY) * cHeight;

                const intensity = Math.min(255, Math.abs(error) * 500);
                ctx.strokeStyle = `rgba(239, 68, 68, ${intensity/255 + 0.3})`;
                
                ctx.beginPath();
                ctx.moveTo(canvasX, canvasY);
                ctx.lineTo(canvasX, canvasPredY);
                ctx.stroke();
            });
            ctx.setLineDash([]);

            ctx.lineWidth = 4;
            ctx.strokeStyle = '#22c55e';
            ctx.beginPath();
            const yAt0 = (1 - (w * 0 + b)) * cHeight;
            const yAt1 = (1 - (w * 1 + b)) * cHeight;
            ctx.moveTo(0, yAt0);
            ctx.lineTo(cWidth, yAt1);
            ctx.stroke();
        }

        points.forEach(p => {
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.arc(p.x * cWidth, (1 - p.y) * cHeight, 7, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#1e3a8a';
            ctx.lineWidth = 2;
            ctx.stroke();
        });

        updateStatusBoard(totalError);
    }

    function updateStatusBoard(totalError) {
        if (w !== null && b !== null) {
            const sign = b >= 0 ? '+' : '-';
            eqDisplay.innerHTML = `y = <span style="color:#2563eb">[가중치: ${w.toFixed(2)}]</span>x ${sign} <span style="color:#16a34a">[편향: ${Math.abs(b).toFixed(2)}]</span>`;
            
            const mse = points.length > 0 ? totalError / points.length : 0;
            errorDisplay.textContent = mse.toFixed(4);
        } else {
            eqDisplay.textContent = '선이 없습니다';
            errorDisplay.textContent = '0.0000';
        }
        
        btnPrev.disabled = history.length === 0;
        btnStep.disabled = w === null || points.length === 0;
        btnAuto.disabled = w === null || points.length === 0;
    }

    function saveState() {
        history.push({
            points: JSON.parse(JSON.stringify(points)),
            w: w, b: b
        });
    }

    function learnStep() {
        if (points.length === 0) return;
        saveState();

        let wGradient = 0;
        let bGradient = 0;
        const N = points.length;

        points.forEach(p => {
            const predY = w * p.x + b;
            const error = predY - p.y;
            wGradient += (2/N) * error * p.x;
            bGradient += (2/N) * error;
        });

        w -= learningRate * wGradient;
        b -= learningRate * bGradient;

        draw();
    }

    btnInit.addEventListener('click', () => {
        if(points.length === 0) {
            alert("먼저 캔버스에 터치하여 점을 찍어주세요!");
            return;
        }
        if(w !== null) saveState();
        
        w = (Math.random() - 0.5) * 2; 
        b = Math.random() * 0.5 + 0.25;
        history = []; 
        draw();
    });

    btnStep.addEventListener('click', () => {
        stopAuto();
        learnStep();
    });

    btnPrev.addEventListener('click', () => {
        if (history.length > 0) {
            stopAuto();
            const lastState = history.pop();
            points = lastState.points;
            w = lastState.w;
            b = lastState.b;
            draw();
        }
    });

    btnAuto.addEventListener('click', () => {
        if (isAutoRunning) {
            stopAuto();
        } else {
            isAutoRunning = true;
            btnAuto.textContent = '일시정지 ⏸';
            btnAuto.style.backgroundColor = '#f59e0b';
            
            autoInterval = setInterval(() => {
                const previousMse = errorDisplay.textContent;
                
                learnStep();
                
                // 오차 변화가 없으면 조기 종료
                if (previousMse === errorDisplay.textContent) {
                    stopAuto();
                    showToast("🎉 최적의 선을 찾았습니다! (조기 종료)");
                }
            }, 50); 
        }
    });

    function stopAuto() {
        isAutoRunning = false;
        clearInterval(autoInterval);
        btnAuto.textContent = '연속 학습 ▶';
        btnAuto.style.backgroundColor = 'var(--success)';
    }

    btnReset.addEventListener('click', () => {
        stopAuto();
        points = []; w = null; b = null; history = [];
        draw();
    });

    function showToast(msg) {
        toast.textContent = msg;
        toast.style.opacity = 1;
        setTimeout(() => toast.style.opacity = 0, 1500); 
    }

    // 초기 화면 그리기
    draw();
</script>
</body>
</html>
